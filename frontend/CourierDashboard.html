<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - QuickDrop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="header-inner container">
            <a href="landingpage.html" class="logo">QuickDrop</a>
            
            <nav>
                <ul class="nav-menu" id="navMenu">
                    <li><a href="#" class="nav-link active">My Tasks</a></li>
                    
                    <li class="desktop-only-status">
                        <div class="status-toggle">
                            <span class="dot"></span>
                            <span>Online</span>
                        </div>
                    </li>
                    
                    <li class="profile-menu">
                        <a href="#" class="profile-toggle" id="profileToggle">Profile ▼</a>
                        <ul class="dropdown-menu" id="profileDropdown">
                            <li><a href="#">Settings</a></li>
                            <li><a href="login.html">Sign Out</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
            
            <div class="mobile-only-status">
                <span class="dot"></span>
                <span>Online</span>
            </div>
            
            <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
        </div>
    </header>

    <main class="container">

        <!-- Dashboard greeting placeholder (consistent welcome slot) -->
        <div id="dashboardGreeting" class="dashboard-greeting" aria-live="polite"></div>

        <div class="dashboard-header">
            <h1>Your Tasks</h1>
        </div>
        
        <section class="content-section current-task">
            <h2>Current Task</h2>
            <div class="current-task-container">
                <div class="loading-skeleton">
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </section>
        
        <section class="content-section upcoming-tasks">
            <h2>Available Orders to Accept</h2>
            <div class="list-container">
                <div class="loading-skeleton">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>
        </section>
            
    </main>

    <script src="script.js"></script>
</body>
</html>
